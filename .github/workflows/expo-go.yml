# Publica la app en los servidores de Expo (EAS Update) cada vez que se sube algo a
# main, para abrirla en Expo Go SIN el ordenador encendido:
# exp://u.expo.dev/bf4c1bdd-dea3-4040-b236-458205d44d0e?runtime-version=exposdk%3A58.0.0&channel-name=expo-go
#
# Expo Go solo carga publicaciones con runtimeVersion "exposdk:<SDK>". Ese valor se pone
# AQUÍ, solo durante la publicación: no lo pongas en app.json (rompe Expo Go en local).
# Si se sube de SDK, cambia RUNTIME_EXPO_GO.
#
# Necesita el secreto EXPO_TOKEN del repositorio (Settings > Secrets and variables >
# Actions > Secrets). Sin él, este trabajo se salta y la web se publica igual.
name: Publicar en Expo Go

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: expo-go
  cancel-in-progress: true

env:
  RUNTIME_EXPO_GO: exposdk:58.0.0

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que existe EXPO_TOKEN
        id: token
        run: echo "hay=${{ secrets.EXPO_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      # Sin el secreto no se publica: se avisa en el resumen de la ejecución, pero no se
      # marca como fallo para no poner en rojo cada subida mientras el usuario lo crea.
      - if: steps.token.outputs.hay != 'true'
        run: echo "::warning title=Expo Go sin publicar::Falta el secreto EXPO_TOKEN en GitHub. Expo Go (sin ordenador) se queda en la última versión publicada a mano."
      - if: steps.token.outputs.hay == 'true'
        uses: actions/checkout@v4
      - if: steps.token.outputs.hay == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.token.outputs.hay == 'true'
        run: npm ci
      # Si alguna prueba falla, no se publica
      - if: steps.token.outputs.hay == 'true'
        run: npm test
      - if: steps.token.outputs.hay == 'true'
        name: Versión de ejecución de Expo Go (solo para esta publicación)
        run: |
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('app.json'));a.expo.runtimeVersion=process.env.RUNTIME_EXPO_GO;fs.writeFileSync('app.json',JSON.stringify(a,null,2))"
      - if: steps.token.outputs.hay == 'true'
        name: Publicar en el canal expo-go
        run: npx --yes eas-cli@latest update --branch expo-go --platform all --environment production --non-interactive --message "$(git log -1 --format=%s)"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_SKIP_AUTO_FINGERPRINT: '1'
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
          EXPO_PUBLIC_TOMTOM_MAPA_KEY: ${{ vars.TOMTOM_MAPA_KEY }}
