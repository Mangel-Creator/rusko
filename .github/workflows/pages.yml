# Compila la versión web de Rusko y la publica en GitHub Pages
# cada vez que se sube algo a la rama main.
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Si alguna prueba falla, no se publica
      - run: npm test
      # Dirección y clave PÚBLICA de Supabase (captura con IA). Son variables del
      # repositorio (Settings > Secrets and variables > Actions > Variables), no secretos:
      # la clave pública puede ir en la web. Sin ellas, la web funciona sin la IA.
      - run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
          # Clave de TomTom solo para dibujar el tráfico en el mapa web (fase 6).
          EXPO_PUBLIC_TOMTOM_MAPA_KEY: ${{ vars.TOMTOM_MAPA_KEY }}
      # GitHub Pages ignora las carpetas que empiezan por "_" si no hay este archivo
      - run: touch dist/.nojekyll
      # Si alguien abre una ruta directa (por ejemplo /semana) y no existe, carga la app igualmente
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
